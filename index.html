<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071619" />
    <title>Light Show</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <section class="welcome" id="welcome">
        <p class="eyebrow">Live audience light show</p>
        <h1>Fais partie de la lumiere.</h1>
        <p class="intro">Ton ecran rejoindra le spectacle au prochain signal.</p>
        <button class="join-button" id="joinButton" type="button">Je participe</button>
        <p class="notice">Garde ton telephone allume et la luminosite assez haute.</p>
      </section>

      <section class="waiting" id="waiting" hidden aria-live="polite">
        <div class="pulse" aria-hidden="true"></div>
        <p class="eyebrow">Connexion au show</p>
        <h1>En attente du prochain signal</h1>
        <p id="connectionStatus">Preparation de ton ecran...</p>
      </section>

      <div class="show-label" id="showLabel" hidden aria-live="polite"></div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
