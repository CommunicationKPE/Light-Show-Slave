<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071619" />
    <title>Light Show</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <section class="welcome" id="welcome">
        <img class="eyebrow-logo" src="assets/Logo.png" alt="Katy Perry EXPERIENCE by Karen La Gioia" />
        <h1>Fais partie de la lumière.</h1>
        <p class="intro">Ton ecran rejoindra le spectacle.</p>
        <button class="join-button" id="joinButton" type="button">Je participe</button>
        <p class="notice">Garde ton téléphone allumé et la luminosité assez haute.</p>
      </section>
      <section class="waiting" id="waiting" hidden aria-live="polite">
        <div class="pulse" aria-hidden="true"></div>
        <p class="eyebrow">Connecté au show</p>
        <p id="connectionStatus">Preparation de ton ecran...</p>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
