<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regie - Light Show</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-body">
    <main class="console">
      <header>
        <img class="console-logo" src="assets/Logo.png" alt="Regie" />
        <p id="adminStatus" class="status">Connexion a Firebase...</p>
        <p class="device-count" hidden>Appareils connectés : <output id="deviceCount">0</output></p>
      </header>
      <form id="loginForm" class="login-form">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Ouvrir la regie</button>
      </form>
      <section class="cue-panel" aria-label="Commandes de couleurs" hidden>
        <button class="cue black" data-color="#000000" data-label="Noir" type="button">Noir</button>
        <button class="cue red" data-color="#FF0000" data-label="Rouge" type="button">Rouge</button>
        <button class="cue green" data-color="#00FF00" data-label="Vert" type="button">Vert</button>
        <button class="cue blue" data-color="#0000FF" data-label="Bleu" type="button">Bleu</button>
        <button class="cue yellow" data-color="#FFFF00" data-label="Jaune" type="button">Jaune</button>
        <button class="cue cyan" data-color="#00FFFF" data-label="Cyan" type="button">Cyan</button>
        <button class="cue magenta" data-color="#FF00FF" data-label="Magenta" type="button">Magenta</button>
        <button class="cue white" data-color="#FFFFFF" data-label="Blanc" type="button">Blanc</button>
        <button class="cue gray" data-color="#818181" data-label="Gris moyen" type="button">Gris moyen</button>
        <button class="cue orange" data-color="#FF8100" data-label="Orange" type="button">Orange</button>
        <button class="cue violet" data-color="#8100FF" data-label="Violet" type="button">Violet</button>
        <button class="cue pink" data-color="#FF0081" data-label="Rose" type="button">Rose</button>
      </section>
      <div class="admin-actions" hidden>
        <label for="duration">Transition <output id="durationValue">350 ms</output></label>
        <input id="duration" type="range" min="0" max="2000" step="50" value="350" />
        <button class="standby" id="standbyButton" type="button">Mettre en attente</button>
      </div>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
