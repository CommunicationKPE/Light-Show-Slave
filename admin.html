<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regie - Light Show</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-body">
    <main class="console">
      <header>
        <p class="eyebrow">Light show</p>
        <h1>Regie</h1>
        <p id="adminStatus" class="status">Connexion a Firebase...</p>
      </header>
      <form id="loginForm" class="login-form">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Ouvrir la regie</button>
      </form>
      <section class="cue-panel" aria-label="Commandes de couleurs" hidden>
        <button class="cue red" data-color="#ff2448" data-label="Rouge" type="button">Rouge</button>
        <button class="cue amber" data-color="#ffb000" data-label="Ambre" type="button">Ambre</button>
        <button class="cue cyan" data-color="#00d9ff" data-label="Cyan" type="button">Cyan</button>
        <button class="cue lime" data-color="#c8ff2e" data-label="Citron" type="button">Citron</button>
        <button class="cue white" data-color="#fffdf5" data-label="Blanc" type="button">Blanc</button>
        <button class="cue black" data-color="#050607" data-label="Noir" type="button">Noir</button>
      </section>
      <div class="admin-actions" hidden>
        <label for="duration">Transition <output id="durationValue">350 ms</output></label>
        <input id="duration" type="range" min="0" max="2000" step="50" value="350" />
        <button class="standby" id="standbyButton" type="button">Mettre en attente</button>
      </div>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
